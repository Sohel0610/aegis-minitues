# ==============================================================
# 🧩 NGINX CONFIGURATION FOR AEGIS, BTP CHATBOT, CEO TRACKER, NOC & ADANI FLOW
# ==============================================================
worker_processes auto;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # -----------------------------
    # 🔧 Performance Optimizations
    # -----------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 100M;
    server_names_hash_bucket_size 128;

    # -----------------------------
    # 📜 Logging
    # -----------------------------
    access_log logs/access.log;
    error_log logs/error.log;

    # -----------------------------
    # 🔐 Security Settings
    # -----------------------------
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------
    # 🚀 Performance: Gzip + Caching
    # -----------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/javascript application/json application/xml
        font/ttf font/otf image/svg+xml;

    map $sent_http_content_type $expires {
        default off;
        text/html epoch;
        text/css max;
        application/javascript max;
        ~image/ max;
        font/ttf max;
        font/otf max;
    }

    ########################################################
    # 0️⃣ DEFAULT CATCH-ALL SERVERS
    ########################################################
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl http2 default_server;
        server_name _;
        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;
        return 444;
    }

    ########################################################
    # 1️⃣ AEGIS: aegis.adani.com (FastAPI @ 127.0.0.1:8000)
    #    + EQUITY DASHBOARD (FastAPI @ 127.0.0.1:8005)
    ########################################################
    server {
        listen 80;
        server_name aegis-uat.adani.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name aegis-uat.adani.com;

        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;

        access_log logs/aegis_access.log;
        error_log logs/aegis_error.log;

        # --- Canonical redirect for Equity Dashboard subpath ---
        location = /equity-dashboard {
            return 302 /equity-dashboard/;
        }

        # --- Equity Dashboard Integration (Port 8005) ---
        location ^~ /equity-dashboard/ {
            proxy_pass http://127.0.0.1:8005; 
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }

        # --- Main Aegis Application ---
        location / {
            # Support for Private Network Access (PNA)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Private-Network' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;

            # Ensure PNA header is present on actual requests as well
            add_header 'Access-Control-Allow-Private-Network' 'true' always;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

