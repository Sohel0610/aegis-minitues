# ==============================================================
# 🧩 NGINX CONFIGURATION FOR AEGIS, BTP CHATBOT, CEO TRACKER, NOC, 
#    CARBON TRACKER, COBOT, LANDED TARIFF, APP CONNECTIVITY & SHAREHOLDING
# ==============================================================

worker_processes auto;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # -----------------------------
    # 🔧 Performance Optimizations
    # -----------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 100M;
    server_names_hash_bucket_size 128;

    # -----------------------------
    # 📜 Logging
    # -----------------------------
    access_log logs/access.log;
    error_log logs/error.log;

    # -----------------------------
    # 🔐 Security Settings
    # -----------------------------
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------
    # 🚀 Performance: Gzip + Caching
    # -----------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/javascript application/json application/xml
        font/ttf font/otf image/svg+xml;

    map $sent_http_content_type $expires {
        default off;
        text/html epoch;
        text/css max;
        application/javascript max;
        ~image/ max;
        font/ttf max;
        font/otf max;
    }

    ########################################################
    # 0️⃣ DEFAULT CATCH-ALL SERVERS
    ########################################################
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl http2 default_server;
        server_name _;
        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;
        return 444;
    }

    ########################################################
    # 1️⃣ AEGIS: aegis.adani.com (FastAPI @ 127.0.0.1:8000)
    #    + EQUITY DASHBOARD (FastAPI @ 127.0.0.1:8005)
    #    + 🤖 Co-Bot DASHBOARD (React @ 127.0.0.1:3123)
    #    + 📈 SHAREHOLDING PATTERN (FastAPI @ 127.0.0.1:8002)
    ########################################################
    server {
        listen 80;
        server_name aegis.adani.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name aegis.adani.com;

        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;

        access_log logs/aegis_access.log;
        error_log logs/aegis_error.log;

        # --- SHAREHOLDING PATTERN (Nested under Equity Dashboard) ---
        location = /equity-dashboard/shareholding-pattern {
            return 301 https://$host$request_uri/;
        }

        # Dedicated SSO callback for Shareholding — bypasses the multiplexer below
        location = /equity-dashboard/shareholding-pattern/api/auth/callback {
            proxy_pass http://127.0.0.1:8002/api/auth/callback;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }

        location /equity-dashboard/shareholding-pattern/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }

        # --- SHAREHOLDING PATTERN direct base path (SPA makes API calls here) ---
        # The React app is built with base=/shareholding-pattern/ so all its
        # fetch/XHR calls go to /shareholding-pattern/api/... — route them to 8002.
        location = /shareholding-pattern {
            return 301 https://$host$request_uri/;
        }

        location /shareholding-pattern/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }

        # --- EQUITY DASHBOARD ---
        location = /equity-dashboard {
            return 301 https://$host$request_uri/;
        }

        location /equity-dashboard/ {
            proxy_pass http://127.0.0.1:8005; 
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }

        # --- 🔑 SSO CALLBACK MULTIPLEXER ---
        location = /api/auth/callback {
            set $auth_backend http://127.0.0.1:8000;

            if ($arg_state ~* "equity") {
                set $auth_backend http://127.0.0.1:8005;
            }

            if ($arg_state ~* "cobot") {
                set $auth_backend http://127.0.0.1:3123;
            }

            if ($arg_state ~* "shareholding") {
                set $auth_backend http://127.0.0.1:8002;
            }

            proxy_pass $auth_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # --- 🤖 CO-BOT DASHBOARD ---
        location = /cobot {
            return 302 /cobot/;
        }

        location /cobot/ {
            proxy_pass http://127.0.0.1:3123/; 
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }

        # --- MAIN AEGIS SITE ---
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html { root html; }
    }

    ########################################################
    # 2️⃣ BTP CHATBOT (Port 9000)
    ########################################################
    server {
        listen 443 ssl http2;
        server_name agelbtpchatbot.adani.com;
        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;

        location / {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    ########################################################
    # 3️⃣ CEO TRACKER / NOC (Ports 3001 & 5000)
    ########################################################
    server {
        listen 443 ssl http2;
        server_name agelceotracker.adani.com;
        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;

        location /nocdashboard/ { proxy_pass http://127.0.0.1:5000; }
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    ########################################################
    # 4️⃣ NEW APP (External @ Port 4000)
    ########################################################
    server {
        listen 443 ssl http2;
        server_name newapp.adani.com;
        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;

        location / { proxy_pass http://10.121.151.9:4000; }
    }

    ########################################################
    # 5️⃣ NOC-AVC DASHBOARD
    ########################################################
    server {
        listen 443 ssl http2;
        server_name agel-agents.adani.com;
        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;

        location /noc-avc-dashboard/ { proxy_pass http://127.0.0.1:7000; }
        location /carbon-credit-tracker/ { proxy_pass http://127.0.0.1:7005; }
        location /landed-tariff/ { proxy_pass http://127.0.0.1:1580; }
        location /app-connectivity/ { proxy_pass http://127.0.0.1:1581; }

        location = / { return 302 /noc-avc-dashboard/; }
    }

    ########################################################
    # 6️⃣ DIGITALIZED DPR & EXECUTION TRACKER
    ########################################################
    server {
        listen 443 ssl http2;
        server_name digitalized-dpr.adani.com;
        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;

        location /execution-tracker/ { proxy_pass http://127.0.0.1:3121/; }
        location / { proxy_pass http://127.0.0.1:3316; }

        location = /api/sso/callback {
            set $auth_backend http://127.0.0.1:3316;
            if ($cookie_app_target = "execution-tracker") {
                set $auth_backend http://127.0.0.1:3121;
            }
            proxy_pass $auth_backend;
        }
    }
}
