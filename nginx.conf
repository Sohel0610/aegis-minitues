    ########################################################
    # 6️⃣ NOC DASHBOARD SAT: agel-icnoc-dqanalytics-uat.adani.com
    #    Existing NOC @ Port 3000
    #    🆕 ADANI FLOW (DPR) @ Port 3315
    ########################################################
    server {
        listen 80;
        server_name agel-icnoc-dqanalytics-uat.adani.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name agel-icnoc-dqanalytics-uat.adani.com;

        ssl_certificate C:/nginx/certs/cert.pem;
        ssl_certificate_key C:/nginx/certs/key.pem;

        access_log logs/noc_sat_access.log;
        error_log logs/noc_sat_error.log;

        # --- 🚀 ADANI FLOW (DPR PROJECT) INTEGRATION ---
        
        # Canonical redirect for the subpath
        location = /dpr-project {
            return 302 /dpr-project/;
        }

        # Adani Flow Backend (serves both API and Frontend dist on port 3315)
        location /dpr-project/ {
            rewrite ^/dpr-project/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:3315; 
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
